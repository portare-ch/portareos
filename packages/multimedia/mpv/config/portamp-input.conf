# Music, by position, the same hands as the film player and the launcher.
# Every button goes through portamp.lua, which wakes the panel when it is
# dark and only acts on a press made with it lit.

GAMEPAD_ACTION_DOWN     script-binding portamp/pause
GAMEPAD_START           script-binding portamp/pause
GAMEPAD_ACTION_RIGHT    script-binding portamp/quit
GAMEPAD_ACTION_LEFT     script-binding portamp/progress

# Across seeks, along the playlist - the way a list reads.
GAMEPAD_DPAD_RIGHT      script-binding portamp/forward
GAMEPAD_DPAD_LEFT       script-binding portamp/back
GAMEPAD_DPAD_UP         script-binding portamp/prev
GAMEPAD_DPAD_DOWN       script-binding portamp/next

GAMEPAD_LEFT_SHOULDER   script-binding portamp/prev
GAMEPAD_RIGHT_SHOULDER  script-binding portamp/next

# Nothing to do, but a press still wakes the panel.
GAMEPAD_ACTION_UP       script-binding portamp/wake
GAMEPAD_BACK            script-binding portamp/wake
GAMEPAD_MENU            script-binding portamp/wake
GAMEPAD_LEFT_TRIGGER    script-binding portamp/wake
GAMEPAD_RIGHT_TRIGGER   script-binding portamp/wake
GAMEPAD_LEFT_STICK      script-binding portamp/wake
GAMEPAD_RIGHT_STICK     script-binding portamp/wake
