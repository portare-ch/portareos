# The picture for standard definition. Included by start_mpv.sh.
#
# A DVD on this panel is scaled about 2x, and with the default lanczos it
# looked smeared - it was made for a CRT, which drew it as lines with dark
# gaps between them. So SD gets scanlines by default; SELECT turns them off
# and on again.
#
# The scaler is lanczos, mpv's default. Side by side on the device with
# scanlines on, lanczos, spline36, mitchell and the EWA variants could not
# be told apart - the scanlines decide the look, not the scaler - and the
# cost is anything but equal. Measured over 60 s of The Wire (712x478) at
# 24 renders a second:
#   ewa_lanczossharp  GPU at its top clock, 680 MHz, all the time; fan on,
#                     about 1750 rpm
#   lanczos           GPU at its lowest clock, 124 MHz; fan off
#   bilinear          the same as lanczos, and softer
# No dropped frames and A-V 0.000 with any of them.
#
# deinterlace=auto: a DVD straight off the disc is often interlaced, and
# combing looks worse than any scaler. auto only deinterlaces frames ffmpeg
# says are interlaced; a progressive rip (The Wire's, 712x478) was checked on
# the device and passes through untouched.
[sd-picture]
profile-cond=get("height", 0) > 0 and get("height", 0) <= 576
profile-restore=copy-equal
scale=lanczos
scale-antiring=0.6
glsl-shaders=/usr/config/mpv/scanlines.glsl
deinterlace=auto
