# Shape correction for standard-definition 4:3 rips. Included by start_mpv.sh.
#
# A 4:3 DVD stores 720x480 (or 720x576) with non-square pixels and a flag
# saying to show it at 4:3. Rips often re-encode without the flag, so the
# file claims square pixels and a frame 1.46-1.50 wide (704x480, 712x478,
# 720x480) or 1.25 (720x576). mpv believes the file, and on this 4:3 panel
# that puts black bars above and below a picture that was made to fill a
# 4:3 screen - found with a rip of The Wire's first season.
#
# So standard definition within about 12% of 4:3 is shown at 4:3. Checked on
# the device: 712x478, 704x480, 720x480 and 720x576 square-flagged all come
# out 4:3; 640x480 is already 4:3; a 720x480 flagged 16:9 stays 16:9, as do
# 720p and 1080p. HD is never touched: past 576 lines the flag is trusted.
[sd-near-4-3]
profile-cond=get("height", 0) > 0 and get("height", 0) <= 576 and get("video-params/aspect", 0) > 1.17 and get("video-params/aspect", 0) <= 1.51
profile-restore=copy-equal
video-aspect-override=4:3
