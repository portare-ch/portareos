# The pad in mpv, by position - the same as the launcher: the bottom button
# confirms and the right one goes back, whatever the printing on it says.
# Volume stays on the volume keys, where it is for everything else.

GAMEPAD_ACTION_DOWN     cycle pause
GAMEPAD_START           cycle pause
GAMEPAD_ACTION_RIGHT    quit-watch-later     # back: stop, and resume here next time
GAMEPAD_ACTION_UP       show-progress
GAMEPAD_BACK            change-list glsl-shaders toggle /usr/config/mpv/scanlines.glsl; show-text "scanlines ${?glsl-shaders==:off}${!glsl-shaders==:on}"
GAMEPAD_ACTION_LEFT     cycle sub-visibility

GAMEPAD_DPAD_LEFT       seek -10
GAMEPAD_DPAD_RIGHT      seek 10
GAMEPAD_DPAD_DOWN       seek -60
GAMEPAD_DPAD_UP         seek 60

GAMEPAD_LEFT_SHOULDER   cycle audio          # next audio track
GAMEPAD_RIGHT_SHOULDER  cycle sub            # next subtitle track
GAMEPAD_LEFT_TRIGGER    add chapter -1
GAMEPAD_RIGHT_TRIGGER   add chapter 1
