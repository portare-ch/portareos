# Which decoder plays a film. Included by start_mpv.sh.
#
# H.264 and HEVC go to the iris hardware decoder at every size. Measured on
# the device, share of one core over 30 s of playback:
#   712x478 H.264 DVD rip     16% software,  5% hardware
#   1920x1080 H.264, 8 Mbit/s  66% software,  4% hardware
# Hardware frames were compared with software ones for H.264 and HEVC and
# are bit-identical.
#
# demuxer=lavf is what makes that work for Matroska. mpv's own mkv demuxer
# hands packets to the v4l2m2m decoder in a way iris cannot use: the first
# frame fails and the stream ends there, so the picture stays solid green
# while the audio plays on. It happens with every .mkv tried, 712x478 up to
# 1080p, including ones freshly muxed by ffmpeg; the same streams in mp4 or
# MPEG-TS, or the same .mkv read through ffmpeg's demuxer, decode every
# frame. mp4 and TS already go through ffmpeg, so this only changes .mkv.
#
# hwdec-codecs keeps to what iris decodes correctly. mpv has v4l2m2m
# wrappers for MPEG-2, MPEG-4, VC-1 and VP8 too, but iris only takes H.264,
# HEVC, VP9 and AV1, and ffmpeg has no v4l2m2m AV1 decoder. VP9 decodes on
# iris but produced extra frames and decode errors on a test clip, so it
# stays in software. 10-bit HEVC is refused by the wrapper and falls back to
# software by itself.
demuxer=lavf
hwdec=v4l2m2m-copy
hwdec-codecs=h264,hevc
