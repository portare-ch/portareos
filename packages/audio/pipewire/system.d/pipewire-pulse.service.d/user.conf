# pipewire runs as root (patch 001). pipewire-pulse fronting PulseAudio
# clients from another uid gets "restricted" from the core's access module,
# and every client is then refused at SET_CLIENT_NAME: no Steam sounds, no
# FMOD in x86 games. A drop-in, because the package's own unit files win
# over anything placed next to them: scripts/install copies system.d first
# and the package's install tree on top.
[Service]
User=root
