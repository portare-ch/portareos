# The core keeps everything under <system_directory>/pcsx2 (pcsx2-libretro/
# Main.cpp, InitializeConfig), and system_directory is ~/roms/bios here:
# BIOS images in pcsx2/bios, its ini, cache and memory cards beside them.
#
# resources is read-only data the image installs, so it is linked to that.
#
# memcards is linked to the PS2 rom folder. The standalone kept its cards
# there (Mcd001.ps2, Mcd002.ps2), and RetroArch keeps every other core's
# saves next to the games too (savefiles_in_content_dir), so existing
# saves carry over and stay where the rest are.
#
# L only acts when the path does not already exist, so a real directory
# someone has put there is kept.
d /storage/roms/bios/pcsx2              0755 root root - -
d /storage/roms/bios/pcsx2/bios         0755 root root - -
L /storage/roms/bios/pcsx2/resources    -    -    -    - /usr/share/armsx2/resources
L /storage/roms/bios/pcsx2/memcards     -    -    -    - /storage/roms/ps2
