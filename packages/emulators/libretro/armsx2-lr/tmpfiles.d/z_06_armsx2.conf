# The core keeps everything under <system_directory>/pcsx2 (pcsx2-libretro/
# Main.cpp, InitializeConfig), and the system directory is the PS2's BIOS
# folder, /storage/bios/ps2: BIOS images in pcsx2/bios, its ini and cache
# beside them.
#
# resources is read-only data the image installs, so it is linked to that.
#
# memcards is linked to the PS2's save folder, where every other core's
# saves are too (#753): the memory cards are the PS2's saves.
#
# L only acts when the path does not already exist, so a real directory
# someone has put there is kept.
d /storage/bios/ps2/pcsx2              0755 root root - -
d /storage/bios/ps2/pcsx2/bios         0755 root root - -
d /storage/saves/ps2                   0777 root root - -
L /storage/bios/ps2/pcsx2/resources    -    -    -    - /usr/share/armsx2/resources
L /storage/bios/ps2/pcsx2/memcards     -    -    -    - /storage/saves/ps2
