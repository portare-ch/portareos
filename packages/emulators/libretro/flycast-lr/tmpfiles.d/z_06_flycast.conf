# Flycast keeps the Dreamcast's VMUs in <system_directory>/dc, the
# Dreamcast's BIOS folder (Naomi and Atomiswave link to it), and every game
# shares them (flycast_per_content_vmus disabled): they are the Dreamcast's
# saves, so they live in /storage/saves/dreamcast and dc/ links each one
# there (#753). The core opens a VMU and writes it in place ("rb+", or
# "wb+" to make one), which goes through the link.
#
# L only acts when the path does not already exist.
d /storage/bios/dreamcast/dc     0755 root root - -
d /storage/saves/dreamcast       0777 root root - -
L /storage/bios/dreamcast/dc/vmu_save_A1.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_A1.bin
L /storage/bios/dreamcast/dc/vmu_save_A2.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_A2.bin
L /storage/bios/dreamcast/dc/vmu_save_B1.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_B1.bin
L /storage/bios/dreamcast/dc/vmu_save_B2.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_B2.bin
L /storage/bios/dreamcast/dc/vmu_save_C1.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_C1.bin
L /storage/bios/dreamcast/dc/vmu_save_C2.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_C2.bin
L /storage/bios/dreamcast/dc/vmu_save_D1.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_D1.bin
L /storage/bios/dreamcast/dc/vmu_save_D2.bin  -  -  -  -  /storage/saves/dreamcast/vmu_save_D2.bin
