# Run-ahead off for this core.
#
# Run-ahead rolls the emulator forward and restores a savestate every single
# frame, and retroarch.cfg runs it in secondary-instance mode, which keeps a
# second copy of the core loaded to do it. Both assume savestates are cheap.
#
# This core renders on the GPU, so its savestates carry graphics state and a
# second instance would need a GPU context of its own. That is the case
# run-ahead is documented not to handle, and the systems involved have no
# latency headroom to spare on this device anyway.
#
# The 2D cores - Gambatte, mGBA, MesenCE, Snes9x, Genesis Plus GX, PicoDrive,
# FBNeo, NeoCD - render in software, so a second instance needs no GPU
# context, and keep the global setting.
run_ahead_enabled = "false"

# Flycast hands RetroArch a fixed 44100 Hz, the Dreamcast AICA's own rate
# (shell/libretro/libretro.cpp). At the global audio_out_rate of 48000,
# RetroArch resampled every sample on the way to the speaker. The Nova's
# link runs at 44100 as readily as at 48000, so asking for 44100 takes the
# conversion out, as SwanStation.cfg does for the PlayStation. Rate control
# still adjusts the ratio by up to 0.5% to keep audio in step with the
# display.
audio_out_rate = "44100"
