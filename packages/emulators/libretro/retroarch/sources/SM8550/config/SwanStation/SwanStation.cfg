# Integer scaling, for this core only.
#
# It is not a global setting because it is wrong for most cores: a
# framebuffer that does not divide into 1280x960 gets rounded down to the
# next whole multiple, which on GameCube's 640x528 means falling back to
# 1x and leaving a small picture in the middle of the screen.
#
# The PlayStation is the case where it costs nothing. With CropMode set to
# Overscan the active area is 320x240, and 1280x960 is exactly 4x that, so
# integer scaling is pixel-perfect AND fills the panel - no borders, which
# is normally what it is traded against. Games that output another size
# still land on a whole multiple rather than a resampled one.
video_scale_integer = "true"

# Run-ahead off for this core, for the same reason as Flycast and Dolphin:
# GPU_Renderer is Vulkan here (for the 4x upscale), so savestates carry
# graphics state and secondary-instance run-ahead would need a second
# Vulkan context. A software renderer would make run-ahead viable, but at
# the cost of the upscaling this core is configured for.
run_ahead_enabled = "false"

# The PlayStation's SPU runs at 44100 and the graph is allowed to follow it:
# pipewire.conf here carries default.clock.allowed-rates = [ 48000 44100 ].
# Leaving the frontend at 48000 resampled every sample twice for nothing -
# 44100 to 48000 in RetroArch, then whatever the graph did with it. Asking
# for 44100 lets the core, the frontend and the graph agree, and the
# resampler drops out of the path entirely.
#
# Per-core rather than global, because 44100 is the PlayStation's rate and
# not a better default. Every other core here wants something else, so
# moving the graph would relocate the resampling rather than remove it.
audio_out_rate = "44100"
