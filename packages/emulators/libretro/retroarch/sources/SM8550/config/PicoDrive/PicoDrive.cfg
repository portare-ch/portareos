# PicoDrive hands RetroArch 44100 Hz, the default of picodrive_sound_rate,
# which we leave alone. At the global audio_out_rate of 48000, RetroArch
# resampled every sample on the way to the speaker. The Nova's link runs at
# 44100 as readily as at 48000, so asking for 44100 takes the conversion
# out, as SwanStation.cfg does for the PlayStation. Rate control still
# adjusts the ratio by up to 0.5% to keep audio in step with the display.
audio_out_rate = "44100"
