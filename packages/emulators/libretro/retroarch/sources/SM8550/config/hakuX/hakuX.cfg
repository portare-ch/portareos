# hakuX keeps the console's hard disk and its caches in the save directory:
# /storage/saves/xbox, beside /storage/roms/xbox (portare-ch/portareos#753).
savefile_directory = "/storage/saves/xbox"
savefiles_in_content_dir = "false"
# No run-ahead: it would load a second hakuX into RetroArch's process.
run_ahead_enabled = "false"
