# hakuX's save directory: the console's hard disk (hdd/) and the renderer's
# caches (cache/). RetroArch's override (config/hakuX/hakuX.cfg) points
# savefile_directory here, and RetroArch ignores an override directory that
# doesn't exist: on a fresh install the core then got RetroArch's default,
# /storage/.config/retroarch/saves (post-update moves a disk from there).
d /storage/saves       0755 root root - -
d /storage/saves/xbox  0755 root root - -
