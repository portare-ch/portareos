# Dolphin resolves its data directory as <system_directory>/dolphin-emu/Sys
# (DolphinLibretro/Boot.cpp), and system_directory is ~/roms/bios here. That
# path is on /storage, so the image cannot ship it directly; link it to the
# copy the package installs on the rootfs instead.
#
# L only acts when the path does not already exist, so anyone who has put a
# real Sys directory there keeps it.
d /storage/roms/bios/dolphin-emu      0755 root root - -
L /storage/roms/bios/dolphin-emu/Sys  -    -    -    - /usr/share/dolphin-emu/Sys
