# Dolphin resolves its data directory as <system_directory>/dolphin-emu/Sys
# (DolphinLibretro/Boot.cpp). The system directory is the console's BIOS
# folder, /storage/bios/gamecube or /storage/bios/wii (Triforce and WiiWare
# link to those), on /storage, so the image cannot ship it directly; link
# it to the copy the package installs on the rootfs instead. The games'
# saves, its User folder, are in /storage/saves/<system>.
#
# L only acts when the path does not already exist, so anyone who has put a
# real Sys directory there keeps it.
d /storage/bios/gamecube/dolphin-emu      0755 root root - -
L /storage/bios/gamecube/dolphin-emu/Sys  -    -    -    - /usr/share/dolphin-emu/Sys
d /storage/bios/wii/dolphin-emu           0755 root root - -
L /storage/bios/wii/dolphin-emu/Sys       -    -    -    - /usr/share/dolphin-emu/Sys
