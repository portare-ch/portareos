name: Build emu-libretro

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      INCREMENTAL:
        description: "yes to restore this stage's saved state and rebuild only what changed"
        required: false
        default: "no"
        type: string

jobs:
  build-aarch64-emu-libretro:
    timeout-minutes: 360
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
      contents: read
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      TARGET_TYPE: cores_only
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro.tar"
          .github/scripts/retrieve-ccache.sh "$URL" "aarch64-emu-libretro"

      - name: Download aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.aarch64.tar

      - name: Download build aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 build (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64 build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar -xf build.build.aarch64.tar
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64 file
        run: rm build.build.aarch64.tar

      - name: Snapshot the upstream build state
        id: upstream
        run: |
          echo "digest=$(.github/scripts/build-state.sh snapshot \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64)" >> "${GITHUB_OUTPUT}"

      # Restoring .stamps and install_pkg lets scripts/build skip every package
      # whose recipe is unchanged. Skipped when the digest above differs from
      # the one the archive was saved against, and skipped entirely on a run
      # that asked for a full rebuild.
      - name: Restore saved build state
        if: inputs.INCREMENTAL == 'yes'
        env:
          CACHE_REPO: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        run: |
          .github/scripts/build-state.sh restore \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-emu-libretro \
            "${{ steps.upstream.outputs.digest }}"

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/portareos-build:latest" \
              bash -c "./scripts/build_mt emulators"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Print the failing thread logs
        if: failure()
        run: |
          for f in $(grep -oE '\.threads/logs/[0-9]+\.log' output.log | sort -u); do
            echo "::group::${f}"
            tail -n 300 "build.PortareOS-${{ inputs.DEVICE }}.aarch64/${f}" || true
            echo "::endgroup::"
          done

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-emu-libretro)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-emu-libretro)
          path: |
            output.log
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.ccache
          ./.github/scripts/ccache-summary.sh \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache emu-libretro || true
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 2G
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        run: |
          tar -cf ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro.tar ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.ccache 

      - name: Save ccache
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      # Save this stage's own packages and stamps for the next incremental run,
      # tagged with the upstream digest they were built against. Saved on every
      # run, including full ones, so a full rebuild refreshes the state rather
      # than leaving a stale archive behind.
      - name: Save build state
        run: |
          .github/scripts/build-state.sh save \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-emu-libretro \
            "${{ steps.upstream.outputs.digest }}"

      - name: Upload build state
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: "state-aarch64-${{ inputs.DEVICE }}-emu-libretro.part-*"
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Drop the state archive before packing the artifact
        run: rm -f state-aarch64-${{ inputs.DEVICE }}-emu-libretro.part-*

      - name: Compress directory
        run: | 
          sudo tar --remove-files -cf - \
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.stamps | split -b 2G -  build.emu-libretro.tar.part

      - uses: actions/upload-artifact@v7
        with:
          name: emu-libretro (${{ inputs.DEVICE }})
          path: build.emu-libretro.tar.part*
          if-no-files-found: error