name: Build aarch64

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      INCREMENTAL:
        description: "yes to restore this stage's saved state and rebuild only what changed"
        required: false
        default: "no"
        type: string

jobs:
  build-aarch64:
    timeout-minutes: 300
    runs-on: ubuntu-24.04-arm
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}.tar"
          .github/scripts/retrieve-ccache.sh "$URL" "aarch64-base"

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        run: |
          tar --zstd -xf build.aarch64-toolchain.tar.zst

      - name: Clean up compressed aarch64-toolchain file
        run: rm build.aarch64-toolchain.tar.zst

      # Record what the upstream stage artifacts just delivered: a digest of
      # their stamps (the dependency recipes this stage is about to build
      # against) and the list of packages they installed. Both are needed
      # whether or not we restore, because the save step below uses them.
      - name: Snapshot the upstream build state
        id: upstream
        run: |
          echo "digest=$(.github/scripts/build-state.sh snapshot \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64)" >> "${GITHUB_OUTPUT}"

      # Restoring .stamps and install_pkg lets scripts/build skip every package
      # whose recipe is unchanged. Skipped when the digest above differs from
      # the one the archive was saved against, and skipped entirely on a run
      # that asked for a full rebuild.
      - name: Restore saved build state
        if: inputs.INCREMENTAL == 'yes'
        env:
          CACHE_REPO: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        run: |
          .github/scripts/build-state.sh restore \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-base \
            "${{ steps.upstream.outputs.digest }}"

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/portareos-build:latest" \
              bash -c "./scripts/build_distro "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Print the failing thread logs
        if: failure()
        run: |
          for f in $(grep -oE '\.threads/logs/[0-9]+\.log' output.log | sort -u); do
            echo "::group::${f}"
            tail -n 300 "build.PortareOS-${{ inputs.DEVICE }}.aarch64/${f}" || true
            echo "::endgroup::"
          done

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64
          path: |
            output.log
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: PortareOS-base-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/PortareOS-*.img.gz
            target/PortareOS-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Build modules
        if: ${{ inputs.DEVICE == 'RK3326' || inputs.DEVICE == 'H700' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/portareos-build:latest" \
              bash -c "./scripts/build_mt modules "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Print the failing thread logs
        if: failure()
        run: |
          for f in $(grep -oE '\.threads/logs/[0-9]+\.log' output.log | sort -u); do
            echo "::group::${f}"
            tail -n 300 "build.PortareOS-${{ inputs.DEVICE }}.aarch64/${f}" || true
            echo "::endgroup::"
          done

      - name: Archive output.logs (${{ inputs.DEVICE }}-modules)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-modules
          path: |
            output.log
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.ccache
          ./.github/scripts/ccache-summary.sh \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache aarch64 || true
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 2G
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}.tar ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.ccache  

      - name: Save ccache
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true


      # Save this stage's own packages and stamps for the next incremental run,
      # tagged with the upstream digest they were built against. Saved on every
      # run, including full ones, so a full rebuild refreshes the state rather
      # than leaving a stale archive behind.
      - name: Save build state
        run: |
          .github/scripts/build-state.sh save \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-base \
            "${{ steps.upstream.outputs.digest }}"

      - name: Upload build state
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: "state-aarch64-${{ inputs.DEVICE }}-base.part-*"
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Drop the state archive before packing the artifact
        run: rm -f state-aarch64-${{ inputs.DEVICE }}-base.part-*

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          sudo tar --remove-files \
          -cf build.build.aarch64.tar ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/build
          sudo tar --remove-files \
          -cf build.aarch64.tar ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 (${{ inputs.DEVICE }})
          path: build.aarch64.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 build (${{ inputs.DEVICE }})
          path: build.build.aarch64.tar
          if-no-files-found: error
