name: Build toolchain

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      INCREMENTAL:
        description: "yes to restore this stage's saved state and rebuild only what changed"
        required: false
        default: "no"
        type: string

jobs:
  build-aarch64-toolchain:
    timeout-minutes: 300
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
      contents: read
    env:
      AUTOREMOVE: "yes"
      AUTOREMOVE_BLOCK: "gcc glibc libtool flex"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-toolchain-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar"
          .github/scripts/retrieve-ccache.sh "$URL" "aarch64-toolchain"

      # This stage has no upstream artifact to gate on, so it gates on the
      # recipes instead: the archive records which packages it built and a
      # digest over exactly the files calculate_stamp hashes for them, and is
      # refused unless that digest still matches the checkout. A gcc bump
      # rebuilds the toolchain; an emulator recipe does not touch it.
      - name: Restore saved toolchain state
        if: inputs.INCREMENTAL == 'yes'
        env:
          CACHE_REPO: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        run: |
          .github/scripts/build-state.sh restore-root \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-toolchain

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/portareos-build:latest" \
              bash -c "./scripts/build_mt toolchain llvm:host"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Print the failing thread logs
        if: failure()
        run: |
          for f in $(grep -oE '\.threads/logs/[0-9]+\.log' output.log | sort -u); do
            echo "::group::${f}"
            tail -n 300 "build.PortareOS-${{ inputs.DEVICE }}.aarch64/${f}" || true
            echo "::endgroup::"
          done

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
          path: |
            output.log
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Build llvm:target
        if: ${{ inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/portareos-build:latest" \
              bash -c "./scripts/build_mt llvm:target "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Print the failing thread logs
        if: failure()
        run: |
          for f in $(grep -oE '\.threads/logs/[0-9]+\.log' output.log | sort -u); do
            echo "::group::${f}"
            tail -n 300 "build.PortareOS-${{ inputs.DEVICE }}.aarch64/${f}" || true
            echo "::endgroup::"
          done

      - name: Archive output.logs (${{ inputs.DEVICE }}-llvm)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-llvm
          path: |
            output.log
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.ccache
          ./.github/scripts/ccache-summary.sh \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache toolchain || true
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 500M
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.ccache  

      - name: Save ccache
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      # The same path set the artifact below carries, so a restored tree is
      # indistinguishable from one this stage just built.
      - name: Save toolchain state
        run: |
          .github/scripts/build-state.sh save-root \
            build.PortareOS-${{ inputs.DEVICE }}.aarch64 \
            state-aarch64-${{ inputs.DEVICE }}-toolchain \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/build \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/install_* \
            ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.stamps

      - name: Upload toolchain state
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: "state-aarch64-${{ inputs.DEVICE }}-toolchain.part-*"
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Drop the state archive before packing the artifact
        run: rm -f state-aarch64-${{ inputs.DEVICE }}-toolchain.part-*

      - name: Compress directory
        run: |
          tar --zstd -cf build.aarch64-toolchain.tar.zst \
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/toolchain \
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/build \
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.PortareOS-${{ inputs.DEVICE }}.aarch64/.stamps
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})
          path: build.aarch64-toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error