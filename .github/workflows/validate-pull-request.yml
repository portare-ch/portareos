name: Validate pull request
on:
  pull_request:
    branches: [next]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
    branches: [next]
jobs:
  validate-commit:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code (fetch all history for linting)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check that pulse stays banned
        if: github.event_name == 'pull_request'
        run: |
          # Everything speaks PipeWire, natively or through SDL or the alsa
          # plugin. Mentions are only allowed when they turn something off.
          #
          # One exception, the last filter: Steam's arm64 client is a binary
          # that links libpulse.so.0 and cannot be rebuilt, so start_steam.sh
          # links the copy out of Steam's own runtime. Nothing in the image
          # links or builds against it, and pipewire-pulse is what answers it,
          # which is the same ground the pipewire-pulse server stands on.
          HITS=$(grep -rn -w -E 'pulseaudio|libpulse|libpulse-simple|pactl|pacmd|paplay|parec' \
                   packages projects distributions config scripts tools \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
                 | grep -vE '[Pp]ulse[Aa]udio=(0|off|OFF|no|false|disabled)' \
                 | grep -vE '(--without-|--disable-)pulse' \
                 | grep -vE 'ENABLE_PULSEAUDIO=OFF|USE_PULSEAUDIO=OFF|BACKEND_PULSEAUDIO=off' \
                 | grep -vE 'SDL_PULSEAUDIO=OFF|-Dlibpulse=disabled' \
                 | grep -vE 'pipewire/(patches|system\.d)/' \
                 | grep -vE 'steam/scripts/start_steam\.sh:[0-9]+:.*libpulse') || true

          # vice-sa passed --with-pulse, which names no library and so slipped
          # past the pattern above until its build failed on a missing
          # pulse/simple.h. Build flags that ask for pulse count too.
          HITS="$HITS$(grep -rn -E '(--with-pulse|--enable-pulse|-Dpulse|=pulse)\b' \
                         packages projects distributions config scripts tools \
                       | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)"

          if [ -n "$HITS" ]; then
            echo "--------------------------------------------------------"
            echo "❌ pulse is banned, but these lines reference it:"
            echo "$HITS"
            exit 1
          fi
          echo "✅ No pulse outside the pipewire-pulse compatibility server."

      - name: Check that patch hunk headers match their contents
        if: github.event_name == 'pull_request'
        run: |
          # A hunk header that under-counts its own lines makes GNU patch apply
          # only the lines it declares and drop the rest, exit 0. The file
          # arrives truncated and the failure surfaces as a compile error with
          # no obvious cause. 0105's count drifted across three comment edits
          # and broke the kernel build from #411 to #419 without anything in CI
          # noticing.
          python3 .github/scripts/check-patch-hunks.py

      - name: Validate pull request
        if: github.event_name == 'pull_request'
        run: |
          # Flag to track if pull request fails validation
          FAILED=0

          # Get any merge commits in the pull request
          MERGES=$(git log --merges --format='- %h %s' origin/${{ github.base_ref }}..HEAD)

          if [ -n "$MERGES" ]; then
            echo "--------------------------------------------------------"
            echo "❌ This pull request contains merge commits."
            echo
            echo "The following merge commits were found:"
            echo "$MERGES"
            echo
            echo "Please rebase your branch onto '${{ github.base_ref }}' and force-push the updated history."
            FAILED=1
          fi

          # Get the list of commit SHAs in the pull request
          COMMITS=$(git log --no-merges --format="%H" origin/${{ github.base_ref }}..HEAD)

          # Define the regex pattern
          PATTERN='^[a-zA-Z0-9_*./-]+:[[:space:]].+$'

          for SHA in $COMMITS; do
            echo "--------------------------------------------------------"
            echo "Checking commit: $SHA"

            # Extract raw commit message components
            TITLE=$(git log -1 --format="%s" "$SHA")
            BODY=$(git log -1 --format="%b" "$SHA")
            FULL_MSG=$(git log -1 --format="%B" "$SHA")

            echo "Title: '$TITLE'"

            # 1. Check Title Length (Max 72 characters)
            if [ ${#TITLE} -gt 72 ]; then
              echo "❌ ERROR: Title exceeds 72 characters (Length: ${#TITLE})."
              FAILED=1
            fi

            # 2. Check Title Prefix Pattern (e.g., package: text)
            if [[ ! "$TITLE" =~ $PATTERN ]]; then
              echo "❌ ERROR: Title must match the pattern 'package: text'."
              FAILED=1
            fi

            # 3. Check for the blank line gap between Title and Body
            # If there is a body, the second line of the full message must be empty
            LINE_COUNT=$(echo "$FULL_MSG" | wc -l)
            if [ "$LINE_COUNT" -gt 1 ]; then
              SECOND_LINE=$(echo "$FULL_MSG" | sed -n '2p')
              if [ -n "$SECOND_LINE" ]; then
                echo "❌ ERROR: Missing a blank line gap between the title and the message body."
                FAILED=1
              fi
            fi

            # 4. Check Body Line Lengths (Max 72 characters per line)
            if [ -n "$BODY" ]; then
              LONG_LINES=0
              while IFS= read -r line; do
                if [ ${#line} -gt 72 ]; then
                  echo "   ↳ Line too long (${#line} chars): '$line'"
                  LONG_LINES=1
                fi
              done <<< "$BODY"

              if [ $LONG_LINES -eq 1 ]; then
                echo "❌ ERROR: One or more lines in the body exceed 72 characters."
                FAILED=1
              fi
            fi

            if [ $FAILED -eq 0 ]; then
              echo "✅ Commit passed style checks."
            fi
          done

          # Exit with error if any validation failed
          if [ $FAILED -eq 1 ]; then
            echo "--------------------------------------------------------"
            echo "💥 Commit linting failed. Please fix your commit messages."
            exit 1
          fi
