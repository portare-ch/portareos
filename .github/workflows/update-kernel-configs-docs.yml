name: Update kernel configs and docs

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'packages/linux/package.mk'
    branches:
      - next

jobs:
  update-kernel-configs-docs:
    name: Update kernel configs docs
    permissions:
      actions: write
      contents: read
    env:
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: SM8550
            project: PortareOS
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ matrix.device }}-toolchain.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."      

      - name: Get deps
        run: |
          export PROJECT=${{ matrix.project }} DEVICE=${{ matrix.device }}
          yes | ./scripts/checkdeps

      - name: Build toolchain
        run: PROJECT=${{ matrix.project }} DEVICE=${{ matrix.device }} ./scripts/build_mt toolchain;

      # olddefconfig runs bare on the runner here, not in the build container,
      # so the container's dwarves does not help. Without pahole, Kconfig
      # cannot satisfy DEBUG_INFO_BTF, drops it, and takes SCHED_CLASS_EXT
      # with it. Both vanish with no "is not set" line, which is how PR #6
      # came to propose removing the scheduler and looked like a routine
      # config refresh.
      - name: Install pahole, which DEBUG_INFO_BTF needs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dwarves

      - name: Update Kernel Configs
        run: PROJECT=${{ matrix.project }} DEVICE=${{ matrix.device }} ./tools/adjust_kernel_config olddefconfig

      # The regenerated config is about to be proposed as a pull request, so it
      # gets the same assertion the build applies. A refresh that silently
      # drops a required option now fails here instead of arriving as a diff
      # that looks routine.
      - name: Assert the refreshed config still holds the required options
        run: |
          CONF="projects/${{ matrix.project }}/devices/${{ matrix.device }}/linux/linux.aarch64.conf"
          REQ="distributions/${{ matrix.project }}/kernel_options"
          [ -f "${REQ}" ] || { echo "no kernel_options to check against"; exit 0; }
          missing=""
          while read -r opt; do
            case "${opt}" in ''|'#'*) continue ;; esac
            grep -qxF "${opt}" "${CONF}" || missing="${missing}  ${opt}\n"
          done < "${REQ}"
          if [ -n "${missing}" ]; then
            echo "::error::olddefconfig dropped required kernel options:"
            printf "${missing}"
            echo "Kconfig removes a symbol whose dependencies are unmet without saying so."
            echo "Check that this runner has everything those options need (pahole for"
            echo "CONFIG_DEBUG_INFO_BTF), rather than accepting the refreshed config."
            exit 1
          fi
          echo "all $(grep -cvE '^\s*(#|$)' "${REQ}") required options survived olddefconfig"

      - name: Update documentation
        run: PROJECT=${{ matrix.project }} DEVICE=${{ matrix.device }} DEVICE_SPECIFIC_EMULATORS=no EMULATION_DEVICE=no ENABLE_32BIT=no TARGET_TYPE=none ./scripts/build emulators

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-config-(${{ matrix.device }})
          path: ./**/projects/${{ matrix.project }}/devices/${{ matrix.device }}/linux/linux.aarch64.conf
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: docs-(${{ matrix.device }})
          path: ./**/documentation/PER_DEVICE_DOCUMENTATION/${{ matrix.device }}/SUPPORTED_EMULATORS_AND_CORES.md
          if-no-files-found: error

  create-pr-kernel-configs-docs:
    runs-on: ubuntu-24.04-arm
    name: Create PR with updated kernel config or docs
    permissions:
      contents: write
      pull-requests: write
    needs:
      - update-kernel-configs-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download kernel configs
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: kernel-config-*
          merge-multiple: true
      - name: Commit kernel configs
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add .
          git commit -m "linux: kernel config" || echo "No changes to commit"
      - name: Download device docs
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: docs-*
          merge-multiple: true
      - name: Commit documentation
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add .
          git commit -m "documentation: SUPPORTED_EMULATORS_AND_CORES" || echo "No changes to commit"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update kernel configs/device documentation"
          title: "Update kernel configs/device documentation"
          body: "Automated changes by [create-pull-request]"
          base: next
          branch: auto-pr-branch
          delete-branch: true
