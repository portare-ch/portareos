# ARMSX2
# Twice the PS2's resolution, as the standalone ran it (#15): 512x448
# renders at 1024x896 and the output scaler takes it the last step to the
# 1280x960 panel, where native resolution was being stretched 2.1x.
armsx2_upscale = "2x"
# Basic, raised per game to the GameDB's recommendedBlendingLevel (patch 004).
# Upstream only warns about the recommendation, on an OSD the core does not
# show, so every game ran at Basic: NFSU, which recommends High, included.
armsx2_blending_accuracy = "Automatic"
