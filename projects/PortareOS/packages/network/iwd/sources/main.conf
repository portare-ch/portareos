# iwd does the addressing as well as the 802.11. NetworkManager used to
# do it, with iwd as its Wi-Fi backend; there is one interface here and no
# Ethernet, so the layer in between went - portareos#412.
#
# Both must never be on at once. Two DHCP clients on wlan0 fight over the
# address and the default route, so this flag and NetworkManager managing
# wlan0 are mutually exclusive.
[General]
EnableNetworkConfiguration=true
ControlPortOverNL80211=true

[Network]
RoutePriorityOffset=200

NameResolvingService=systemd
EnableIPv6=true


[Scan]
MaximumPeriodicScanInterval=30
