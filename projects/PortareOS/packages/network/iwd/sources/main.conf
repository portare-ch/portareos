# iwd does the addressing as well as the 802.11. NetworkManager used to do
# it, with iwd as its Wi-Fi backend; this device has one interface and no
# Ethernet, so the layer in between is gone - portareos#412.
#
# Nothing else may configure wlan0 while this is on. Two DHCP clients on
# one interface fight over the address and the default route, which is why
# this flag and NetworkManager could never both be present.
[General]
EnableNetworkConfiguration=true
ControlPortOverNL80211=true

[Network]
RoutePriorityOffset=200

NameResolvingService=systemd
EnableIPv6=true


[Scan]
MaximumPeriodicScanInterval=30
