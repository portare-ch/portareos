# PortareOS: NetworkManager manages nothing here any more.
#
# iwd owns the radio and does its own addressing (portareos#412), and this
# device has no Ethernet - one interface, wlan0. Two DHCP clients on it
# would fight over the address and the default route, so wlan0 is
# unmanaged below and NetworkManager is left installed only because Steam
# lists it as a dependency. Removing it is the next step, once that is
# settled.

[main]
auth-polkit=false
plugins=keyfile
dhcp=internal
dns=systemd-resolved


[keyfile]
path=/storage/.config/NetworkManager/system-connections
# PortareOS USB gadget not DHCP to a router.
unmanaged-devices=interface-name:wlan0;interface-name:gadget;interface-name:usb0;interface-name:usbnet;interface-name:rndis0

# PortareOS: keep trying a saved network that is in range. This counts failed
# activation attempts; with no saved network in sight nothing is attempted and
# the setting is idle, whatever its value. The default, 4, blocks the profile
# after four failures until a timeout of about five minutes - and at boot the
# first attempts are made while the radio's firmware is still loading after the
# rfkill unblock, so those five minutes were the boot's. 0 is "keep trying",
# with NetworkManager's own backoff between attempts.
[connection]
connection.autoconnect-retries=0
