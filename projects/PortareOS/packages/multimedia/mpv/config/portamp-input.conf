# Music, by position, the same hands as the film player and the launcher.
# The bottom button plays and pauses, the right one leaves.

GAMEPAD_ACTION_DOWN     cycle pause
GAMEPAD_START           cycle pause
GAMEPAD_ACTION_RIGHT    quit

GAMEPAD_DPAD_LEFT       playlist-prev
GAMEPAD_DPAD_RIGHT      playlist-next
GAMEPAD_DPAD_DOWN       seek -10
GAMEPAD_DPAD_UP         seek 10

GAMEPAD_LEFT_SHOULDER   playlist-prev
GAMEPAD_RIGHT_SHOULDER  playlist-next
GAMEPAD_ACTION_LEFT     show-progress
