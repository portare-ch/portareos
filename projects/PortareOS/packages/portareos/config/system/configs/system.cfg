# parallel is the whole reason to run this core rather than
# mupen64plus-next: ParaLLEl-RDP is a low-level, hardware-accurate RDP
# implemented as Vulkan compute, and it gets the framebuffer effects HLE
# plugins guess at - the lens of truth, Banjo's transitions, DK64's fog.
# With gfxplugin set to an HLE renderer instead, this core is simply an
# older mupen64plus and the better answer would be mupen64plus-next.
# The paired LLE RSP lives in the core's own opt file, which setsettings
# does not write.
