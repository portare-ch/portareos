# 2 is Vulkan. There is no native GL driver in this image, so 1 (OpenGL)
# reaches the GPU through zink, which armsx2 reports as
#
#   GL_RENDERER: zink Vulkan 1.4(Turnip Adreno (TM) 740 (MESA_TURNIP))
#   GL: Active framebuffer fetch backend (Adreno profile): None
#
# Behind zink armsx2 sees a GL device rather than an Adreno Vulkan one, so it
# neither gets rasterization-order attachment access for blending nor applies
# its Turnip workarounds. On Vulkan the same log reads ROAA=yes with the
# Adreno profile resolved and its known-bug workarounds active.
#
# Both renderers hold 59.9 fps on a Nova; Vulkan looked materially cheaper on
# EE, VU and GPU, but that comparison mixed launch contexts, so treat the
# architectural argument above as the reason and the margin as unmeasured.
ps2.graphics_backend=2
